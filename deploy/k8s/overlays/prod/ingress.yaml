apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: artemis-2-photos
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - anapaularenault.lol
        - www.anapaularenault.lol
      secretName: artemis-2-photos-live-tls
  rules:
    - host: anapaularenault.lol
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: artemis-2-photos
                port:
                  number: 80
