apiVersion: apps/v1
kind: Deployment
metadata:
  name: artemis-2-photos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artemis-2-photos
  template:
    metadata:
      labels:
        app: artemis-2-photos
    spec:
      containers:
        - name: web
          image: registry.144.91.77.245.sslip.io/artemis-2-photos:bootstrap
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
